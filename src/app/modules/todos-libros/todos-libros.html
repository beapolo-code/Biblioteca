<div class="min-h-screen bg-slate-950 p-6 text-white">

    <h1 class="mb-6 text-3xl font-bold">
        Todos los libros
    </h1>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">

        @for (libro of libros; track libro.id) {

            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4">

                <h2 class="text-lg font-bold">
                    {{ libro.title }}
                </h2>

                <p class="mt-2 text-slate-400">
                    {{ libro.author }}
                </p>

                <p class="mt-2 text-sm text-slate-500">
                    {{ libro.categoryId }}
                </p>
                <a
                [routerLink]="['/admin/detalle-libro', libro.id]"
                class="mt-4 inline-block rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-500"
                >
                Ver detalles
            </a>

            </div>

        }

    </div>

</div>
